# ????
server:
  port: 8085

# JWT ????????
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# JPA ????????
spring:
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    cloud:
      sentinel:
        transport:
          dashboard: http://192.168.192.101:8090 # Sentinel Dashboard ??
        http-method-specify: true