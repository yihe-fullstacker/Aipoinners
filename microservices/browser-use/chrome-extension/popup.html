<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Browser Use</title>
  <style>
    :root {
      --primary: #339cff;
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e0e0e0;
      --text-dim: #888;
      --success: #4caf50;
      --error: #f44336;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      background: var(--card);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.disconnected { background: var(--error); }
    .content { padding: 12px; }
    .tab-info {
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .tab-info .label { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; }
    .tab-info .value { word-break: break-all; font-size: 12px; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .actions button {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .actions button:hover {
      background: var(--primary);
      border-color: var(--primary);
    }
    .actions button:active { transform: scale(0.96); }
    .actions button.full { grid-column: 1 / -1; }
    .result-box {
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
    }
    .result-box.visible { display: block; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      color: var(--text-dim);
    }
    .loading {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--text-dim);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .loading.visible { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .settings-group {
      margin-top: 8px;
    }
    .settings-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .settings-group input[type="checkbox"] {
      accent-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Codex">
    <h1>Codex Browser Use</h1>
    <span class="status-dot disconnected" id="statusDot"></span>
  </div>
  
  <div class="content">
    <div class="tab-info" id="tabInfo">
      <div class="label">Current Tab</div>
      <div class="value" id="tabTitle">Loading...</div>
      <div class="value" id="tabUrl" style="font-size:11px;color:var(--text-dim);margin-top:4px;"></div>
    </div>

    <div class="actions">
      <button onclick="getPageContent()">📄 Get Content</button>
      <button onclick="getVisibleText()">📝 Get Text</button>
      <button onclick="getPageLinks()">🔗 Get Links</button>
      <button onclick="execPrompt()" class="full">🤖 Ask Codex About This Page</button>
      <button onclick="highlightLinks()" style="color:#ff9800">🎯 Highlight Links</button>
      <button onclick="clearHighlights()">✖️ Clear Highlights</button>
    </div>

    <div class="result-box" id="resultBox"></div>
    <div class="loading" id="loading"></div>

    <div class="settings-group">
      <label>
        <input type="checkbox" id="autoConnect" onchange="saveSettings()"> 
        Auto-connect to current page
      </label>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">Initializing...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
