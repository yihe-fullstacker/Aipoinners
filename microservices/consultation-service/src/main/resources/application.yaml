spring:
  application:
    name: consultation-service
  # ?????
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  # JPA ??
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  # Nacos ????
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        register-enabled: true
  service-registry:
    auto-registration:
      enabled: true

# ????
server:
  port: 8083

# JWT ??
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# MyBatis ??
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Python AI ??
python:
  ai:
    service:
      url: ${PYTHON_AI_SERVICE_URL:}
      prefer-v2: ${PYTHON_AI_SERVICE_PREFER_V2:}
      allow-mock-fallback: ${PYTHON_AI_SERVICE_ALLOW_MOCK_FALLBACK:}

# ????
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ????
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"