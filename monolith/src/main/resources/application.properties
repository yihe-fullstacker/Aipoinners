server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=120MB

file.upload-dir=./uploads

python.ai.service.url=${PYTHON_AI_SERVICE_URL:}
python.ai.service.prefer-v2=${PYTHON_AI_SERVICE_PREFER_V2:}
python.ai.service.allow-mock-fallback=${PYTHON_AI_SERVICE_ALLOW_MOCK_FALLBACK:}

openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
openai.api-key=${QWEN_API_KEY:}
openai.chat.options.model-name=qwen-turbo
openai.chat.fallback.model-name=qwen-plus
openai.vision.model-name=qwen3-vl-plus

spring.data.redis.host=localhost
spring.data.redis.port=6379

mybatis.configuration.map-underscore-to-camel-case=true

# DeepSeek API
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.key=${Deepseek_API_KEY}

#  AI Search API
baidu.ai-search.url=https://qianfan.baidubce.com/v2/ai_search/chat/completions
baidu.ai-search.api-key=${QIANFAN_API_KEY:}

aliyun.accessKeyId=${ALIYUN_ACCESS_KEY_ID:}
aliyun.accessKeySecret=${ALIYUN_ACCESS_KEY_SECRET:}
aliyun.regionId=cn-hangzhou
aliyun.signName=\u901f\u901a\u4e92\u8054\u9a8c\u8bc1\u7801
aliyun.templateCode=100001
aliyun.sms.codeType=1
aliyun.sms.codeLength=6
aliyun.sms.validTime=300
aliyun.sms.interval=60

# Dify medical assistant workflow
dify.workflow.base-url=http://47.108.52.206/v1/workflows/run
dify.workflow.api-key=${DIFY_API_KEY:}
dify.workflow.input-key=query
dify.workflow.timeout-seconds=40
